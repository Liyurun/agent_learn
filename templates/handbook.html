  <style>
    :root,
    html[data-theme="paper"] {
      --bg: #fbfaf7;
      --bg2: #f2efe8;
      --ink: #1e2329;
      --muted: #6f6a60;
      --rule: #e2ddd0;
      --accent: #0d7d72;      /* deep teal */
      --accent2: #c2820a;     /* amber gold */
      --dark: #0c1a24;        /* cover dark */
      --dark2: #122a34;
      --topnav-bg: rgba(251,250,247,0.92);
      --cover-overlay: linear-gradient(90deg, rgba(8,18,26,0.92) 0%, rgba(8,18,26,0.72) 45%, rgba(8,18,26,0.25) 100%);
      --font-head: 'Bricolage', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font: 'Lora', 'Noto Serif CJK SC', 'Songti SC', 'SimSun', serif;
      --font-cjk: 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-mono: 'JBMono', 'Noto Sans Mono CJK SC', monospace;
      --max: 940px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; scroll-padding-top: 70px; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
    }
    mark.key { background: none; color: var(--accent); font-weight: 700; }
    mark.key2 { background: none; color: var(--accent2); font-weight: 700; }

    /* === Top nav === */
    .topnav {
      position: sticky; top: 0; z-index: 100;
      background: var(--topnav-bg);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--rule);
    }
    .topnav-inner {
      max-width: 1180px; margin: 0 auto; padding: 0.6rem 1.2rem;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    }
    .topnav .brand {
      font-family: var(--font-head); font-weight: 700; font-size: 0.95rem;
      color: var(--ink); letter-spacing: 0.02em; white-space: nowrap; text-decoration: none;
    }
    .topnav .brand span { color: var(--accent); }
    .topnav nav { display: flex; gap: 0.3rem; flex-wrap: wrap; }
    .topnav nav a {
      font-family: var(--font-cjk); font-size: 0.82rem; color: var(--muted);
      text-decoration: none; padding: 0.3rem 0.7rem; border-radius: 999px;
      transition: all 0.2s;
    }
    .topnav nav a:hover { color: var(--accent); background: var(--bg2); }
    .book-nav { align-items: center; }
    .nav-group { position: relative; }
    .nav-trigger { display: block; }
    .nav-trigger::after { content: '⌄'; margin-left: 0.28rem; font-size: 0.72em; }
    .nav-dropdown {
      display: none; position: absolute; top: calc(100% + 0.35rem); left: 0; z-index: 230;
      width: min(21rem, calc(100vw - 2rem)); max-height: min(70vh, 34rem); overflow-y: auto;
      padding: 0.45rem; border: 1px solid var(--rule); border-radius: 12px;
      background: var(--bg); color: var(--ink); box-shadow: 0 16px 38px rgba(0,0,0,0.18);
    }
    .nav-group:hover > .nav-dropdown,
    .nav-group:focus-within > .nav-dropdown,
    .nav-group.is-open > .nav-dropdown { display: block; }
    .topnav .nav-dropdown a {
      display: flex; align-items: baseline; gap: 0.65rem; border-radius: 8px;
      padding: 0.48rem 0.58rem; color: var(--ink); line-height: 1.45;
    }
    .topnav .nav-dropdown a:hover,
    .topnav .nav-dropdown a:focus-visible,
    .topnav .nav-dropdown a.active { color: var(--accent); background: var(--bg2); outline: none; }
    .nav-number {
      flex: 0 0 2rem; font-family: var(--font-mono); font-size: 0.74rem; color: var(--muted);
    }
    .nav-trigger.active, .nav-resource.active { color: var(--accent); background: var(--bg2); }
    .nav-trigger:focus-visible, .nav-resource:focus-visible,
    .mobile-book-toggle:focus-visible, .mobile-part-trigger:focus-visible,
    .outline-toggle:focus-visible, .outline-link:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }
    .mobile-book-toggle, .mobile-book-nav { display: none; }
    .mobile-book-nav[hidden], .mobile-part-links[hidden],
    .mobile-outline[hidden] { display: none !important; }

    /* === Current chapter outline === */
    .chapter-outline {
      display: none; position: fixed; z-index: 90; top: 5.2rem;
      left: calc(50% + (var(--max) / 2) + 2rem); width: min(15rem, calc(50vw - (var(--max) / 2) - 3rem));
      max-height: calc(100vh - 7rem); overflow-y: auto; padding-left: 1rem;
      border-left: 1px solid var(--rule); font-family: var(--font-cjk);
    }
    .chapter-outline-title {
      font-family: var(--font-head); font-size: 0.78rem; letter-spacing: 0.08em;
      color: var(--muted); margin-bottom: 0.55rem;
    }
    .chapter-outline-links { display: grid; gap: 0.16rem; }
    .outline-link {
      display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      padding: 0.34rem 0.5rem; border-left: 2px solid transparent; border-radius: 0 6px 6px 0;
      color: var(--muted); text-decoration: none; font-size: 0.8rem; line-height: 1.4;
    }
    .outline-link:hover, .outline-link.active,
    .outline-link[aria-current="location"] {
      color: var(--accent); border-left-color: var(--accent); background: var(--bg2);
    }
    .outline-toggle, .mobile-outline { display: none; }
    @media (min-width: 1281px) {
      .chapter-outline.has-items { display: block; }
    }

    /* === Cover === */
    .cover {
      position: relative; background: var(--dark);
      background-image: url('{{ASSET_PREFIX}}/assets/hero-cover.jpg');
      background-size: cover; background-position: center;
      color: #fff; overflow: hidden;
    }
    .cover::after {
      content: ''; position: absolute; inset: 0;
      background: var(--cover-overlay);
    }
    .cover-inner {
      position: relative; z-index: 2;
      max-width: 1180px; margin: 0 auto; padding: 6rem 1.2rem 5rem;
    }
    .cover .eyebrow {
      font-family: var(--font-mono); font-size: 0.8rem; letter-spacing: 0.28em;
      text-transform: uppercase; color: #6fd3c8; margin-bottom: 1.4rem;
    }
    .cover h1 {
      font-family: var(--font-head); font-weight: 700;
      font-size: clamp(2.4rem, 6vw, 4.2rem); line-height: 1.08;
      letter-spacing: -0.01em; margin-bottom: 1.2rem; max-width: 16ch;
    }
    .cover h1 em { font-style: normal; color: var(--accent2); }
    .cover .sub {
      font-family: var(--font-cjk); font-size: clamp(1rem, 2vw, 1.25rem);
      color: #c7d3d8; max-width: 40ch; line-height: 1.7; margin-bottom: 2.2rem;
    }
    .cover-meta {
      display: flex; gap: 2.2rem; flex-wrap: wrap;
      font-family: var(--font-cjk); font-size: 0.85rem; color: #9fb0b6;
      border-top: 1px solid rgba(255,255,255,0.15); padding-top: 1.4rem; max-width: 640px;
    }
    .cover-meta b { display: block; font-size: 1.5rem; color: #fff; font-family: var(--font-head); }

    /* === Layout === */
    .page {
      max-width: var(--max); margin: 0 auto; padding: 0 1.2rem;
    }
    section.chapter { padding: 3.2rem 0 1rem; scroll-margin-top: 70px; }
    .part-divider {
      max-width: 1180px; margin: 2.5rem auto 0; padding: 0 1.2rem;
    }
    .part-divider-inner {
      background: var(--dark); color: #fff; border-radius: 14px;
      padding: 2.4rem 2.2rem; display: flex; align-items: center; gap: 1.6rem;
      position: relative; overflow: hidden;
    }
    .part-divider-inner::before {
      content: ''; position: absolute; right: -40px; top: -40px;
      width: 200px; height: 200px; border-radius: 50%;
      background: radial-gradient(circle, rgba(13,125,114,0.35), transparent 70%);
    }
    .part-num {
      font-family: var(--font-head); font-weight: 700; font-size: 3.4rem;
      color: var(--accent2); line-height: 1; min-width: 90px;
    }
    .part-divider h2 {
      font-family: var(--font-head); font-size: 1.7rem; margin-bottom: 0.4rem; border: none; padding: 0;
    }
    .part-divider p { font-family: var(--font-cjk); color: #a9bcc2; font-size: 0.95rem; }

    h2.chap-title {
      font-family: var(--font-head); font-weight: 700;
      font-size: 1.9rem; line-height: 1.25; color: var(--ink);
      padding-bottom: 0.6rem; margin-bottom: 1.4rem;
      border-bottom: 2px solid var(--accent);
      display: flex; align-items: baseline; gap: 0.7rem;
    }
    h2.chap-title .kicker {
      font-family: var(--font-mono); font-size: 0.9rem; color: var(--accent);
      font-weight: 400;
    }
    h3 {
      font-family: var(--font-head); font-weight: 700; font-size: 1.25rem;
      color: var(--ink); margin: 2rem 0 0.8rem;
    }
    h3::before { content: '▸ '; color: var(--accent2); }
    h4 {
      font-family: var(--font-cjk); font-weight: 700; font-size: 1.02rem;
      color: var(--accent); margin: 1.4rem 0 0.5rem;
    }
    p { margin-bottom: 1rem; }
    p, li { font-size: 1.02rem; }
    strong { color: var(--ink); font-weight: 700; }
    a { color: var(--accent); }
    ul, ol { margin: 0 0 1rem 1.3rem; }
    li { margin-bottom: 0.4rem; }

    /* Chinese body uses sans for readability in dense sections */
    .cjk { font-family: var(--font-cjk); }

    /* === Callouts === */
    .callout {
      background: var(--bg2); border-left: 4px solid var(--accent);
      border-radius: 0 8px 8px 0; padding: 1.1rem 1.3rem; margin: 1.5rem 0;
      font-family: var(--font-cjk); font-size: 0.96rem;
    }
    .callout.warn { border-left-color: var(--accent2); }
    .callout.tip { border-left-color: var(--accent); }
    .callout .label {
      font-family: var(--font-head); font-weight: 700; font-size: 0.8rem;
      text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent);
      display: block; margin-bottom: 0.4rem;
    }
    .callout.warn .label { color: var(--accent2); }

    /* === Cards grid === */
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1rem; margin: 1.5rem 0; }
    .card {
      background: var(--bg2); border: 1px solid var(--rule); border-radius: 10px;
      padding: 1.2rem 1.3rem; font-family: var(--font-cjk);
    }
    .card h4 { margin-top: 0; color: var(--accent); }
    .card .big { font-family: var(--font-head); font-weight: 700; font-size: 1.9rem; color: var(--accent2); line-height: 1; }
    .card p { font-size: 0.9rem; color: var(--muted); margin-bottom: 0; }

    /* === Tables === */
    .table-wrap { overflow-x: auto; overflow-y: auto; max-height: 640px; margin: 1.5rem 0; border: 1px solid var(--rule); border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; font-family: var(--font-cjk); font-size: 0.9rem; min-width: 560px; }
    thead th {
      background: var(--dark); color: #fff; font-family: var(--font-head); font-weight: 700;
      text-align: left; padding: 0.75rem 0.9rem; font-size: 0.85rem; white-space: nowrap;
    }
    tbody td { padding: 0.7rem 0.9rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
    tbody tr:nth-child(even) { background: var(--bg2); }
    tbody tr:hover { background: #efe9dc; }
    td .tag { font-family: var(--font-mono); font-size: 0.78rem; padding: 0.1rem 0.5rem; border-radius: 4px; background: var(--accent); color: #fff; }
    td .tag.amber { background: var(--accent2); }
    td .tag.gray { background: var(--muted); }

    /* === Code === */
    pre {
      background: var(--dark); color: #e6edf3; border-radius: 10px;
      padding: 1.2rem 1.3rem; overflow-x: auto; margin: 1.3rem 0;
      font-family: var(--font-mono); font-size: 0.85rem; line-height: 1.6;
    }
    pre .cm { color: #7d99a6; }      /* comment */
    pre .kw { color: #ff9d6b; }      /* keyword */
    pre .st { color: #8fd3c8; }      /* string */
    pre .fn { color: #f0c674; }      /* func */
    code {
      font-family: var(--font-mono); font-size: 0.88em;
      background: var(--bg2); padding: 0.1rem 0.4rem; border-radius: 4px; color: var(--accent);
    }
    pre code { background: none; padding: 0; color: inherit; }
    .code-label {
      font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.1em; margin: 1.3rem 0 -0.6rem;
    }

    /* === TOC === */
    .toc { background: var(--bg2); border: 1px solid var(--rule); border-radius: 14px; padding: 2rem 2.2rem; margin: 2.5rem 0; font-family: var(--font-cjk); }
    .toc h2 { font-family: var(--font-head); font-size: 1.4rem; margin-bottom: 1.2rem; border: none; }
    .toc-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem 2.5rem; }
    .toc-group .toc-part { font-family: var(--font-head); font-weight: 700; color: var(--accent2); font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.6rem; }
    .toc-group ol { list-style: none; margin: 0; }
    .toc-group li { margin-bottom: 0.5rem; }
    .toc-group a { color: var(--ink); text-decoration: none; font-size: 0.92rem; display: flex; gap: 0.5rem; }
    .toc-group a:hover { color: var(--accent); }
    .toc-group a .n { color: var(--muted); font-family: var(--font-mono); font-size: 0.8rem; min-width: 1.8rem; }

    /* === Figures === */
    .chart-figure { margin: 2rem 0; }
    .chart-figure figcaption { font-family: var(--font-cjk); font-size: 0.9rem; font-weight: 700; color: var(--ink); margin-bottom: 0.75rem; }
    .diagram { margin: 2rem 0; text-align: center; }
    .diagram img { max-width: 100%; height: auto; border: 1px solid var(--rule); border-radius: 8px; }
    .diagram figcaption { font-family: var(--font-cjk); font-size: 0.82rem; color: var(--muted); margin-top: 0.5rem; }
    figure.diagram pre.mermaid { background: var(--bg2); border-radius: 10px; padding: 1.2rem; border: 1px solid var(--rule); }

    /* === Q&A blocks === */
    .qa { border: 1px solid var(--rule); border-radius: 10px; margin: 1.2rem 0; overflow: hidden; }
    .qa .q { background: var(--bg2); padding: 0.9rem 1.2rem; font-family: var(--font-cjk); font-weight: 700; color: var(--ink); display: flex; gap: 0.7rem; }
    .qa .q .qmark { color: var(--accent); font-family: var(--font-head); }
    .qa .a { padding: 1rem 1.2rem; font-family: var(--font-cjk); font-size: 0.95rem; }
    .qa .a .amark { color: var(--accent2); font-weight: 700; font-family: var(--font-head); margin-right: 0.5rem; }
    .difficulty { font-family: var(--font-mono); font-size: 0.72rem; padding: 0.1rem 0.5rem; border-radius: 4px; margin-left: auto; align-self: center; }
    .difficulty.easy { background: #e6f2e6; color: #2e7d32; }
    .difficulty.mid { background: #fdf0d5; color: #b8860b; }
    .difficulty.hard { background: #fbe3e0; color: #c0392b; }

    /* === Footer === */
    footer { background: var(--dark); color: #c7d3d8; margin-top: 4rem; padding: 3rem 1.2rem; }
    footer .sources { max-width: var(--max); margin: 0 auto; font-family: var(--font-cjk); }
    footer .sources h2 { font-family: var(--font-head); color: #fff; font-size: 1.3rem; margin-bottom: 1rem; }
    footer .sources ol { padding-left: 1.2rem; font-size: 0.82rem; color: #9fb0b6; }
    footer .sources li { margin-bottom: 0.5rem; overflow-wrap: break-word; word-break: break-all; }
    footer .sources .src-title { color: #e6edf3; word-break: normal; }
    footer .sources .src-url { display: block; margin-top: 0.15rem; font-size: 0.8rem; color: #6fd3c8; word-break: break-all; }
    footer .sources a { color: #6fd3c8; word-break: break-all; }
    footer .foot-note { max-width: var(--max); margin: 2rem auto 0; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.12); font-family: var(--font-cjk); font-size: 0.82rem; color: #7d8f95; }

    sup a { color: var(--accent); text-decoration: none; font-size: 0.75em; font-weight: 700; }
    sup a:hover { text-decoration: underline; }

    /* ===================== INTERACTIVE LAYER ===================== */

    /* Theme palettes */
    html[data-theme="warm"] {
      --bg: #f7f0e3;
      --bg2: #eee2cf;
      --ink: #30271f;
      --muted: #756657;
      --rule: #d9c8ae;
      --accent: #8b5e34;
      --accent2: #b87818;
      --dark: #342820;
      --dark2: #49372a;
      --topnav-bg: rgba(247,240,227,0.93);
      --cover-overlay: linear-gradient(90deg, rgba(43,31,23,0.93) 0%, rgba(55,38,27,0.74) 45%, rgba(58,40,28,0.28) 100%);
    }
    html[data-theme="mist"] {
      --bg: #f2f6f8;
      --bg2: #e5edf1;
      --ink: #1d2b35;
      --muted: #607482;
      --rule: #cbd9e0;
      --accent: #2b7280;
      --accent2: #a16b28;
      --dark: #102733;
      --dark2: #183946;
      --topnav-bg: rgba(242,246,248,0.93);
      --cover-overlay: linear-gradient(90deg, rgba(10,28,38,0.93) 0%, rgba(13,42,54,0.73) 45%, rgba(19,55,68,0.26) 100%);
    }
    html[data-theme="dark"] {
      --bg: #0e1418;
      --bg2: #172129;
      --ink: #e7edf0;
      --muted: #93a3ab;
      --rule: #26343d;
      --accent: #2bb3a3;
      --accent2: #e0a63a;
      --dark: #060d11;
      --dark2: #0d1a22;
      --topnav-bg: rgba(14,20,24,0.93);
      --cover-overlay: linear-gradient(90deg, rgba(4,8,11,0.94) 0%, rgba(4,8,11,0.78) 45%, rgba(4,8,11,0.3) 100%);
    }
    html[data-theme="dark"] tbody tr:hover { background: #1e2b34; }
    html[data-theme="dark"] .difficulty.easy { background: #16321f; color: #74d68a; }
    html[data-theme="dark"] .difficulty.mid { background: #33290f; color: #e3b74e; }
    html[data-theme="dark"] .difficulty.hard { background: #3a1e1c; color: #e78a7f; }
    html { transition: none; }
    body, .topnav, .card, .callout, .qa, pre, table, .toc { transition: background-color 0.3s, border-color 0.3s, color 0.3s; }

    /* Reading progress bar */
    .progress-bar {
      position: fixed; top: 0; left: 0; height: 3px; width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      z-index: 200; transition: width 0.1s linear;
    }

    /* Topnav tools */
    .nav-tools { display: flex; align-items: center; gap: 0.5rem; }
    .icon-btn {
      font-family: var(--font-cjk); font-size: 0.8rem; color: var(--muted);
      background: transparent; border: 1px solid var(--rule); border-radius: 999px;
      padding: 0.3rem 0.75rem; cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .icon-btn:hover { color: var(--accent); border-color: var(--accent); }
    .topnav nav a.active { color: var(--accent); background: var(--bg2); }
    .theme-picker { position: relative; }
    .theme-menu {
      position: absolute; top: calc(100% + 0.55rem); right: 0; z-index: 220;
      width: 11.5rem; padding: 0.4rem; border: 1px solid var(--rule); border-radius: 12px;
      background: var(--bg); color: var(--ink); box-shadow: 0 14px 36px rgba(0,0,0,0.18);
    }
    .theme-menu[hidden] { display: none; }
    .theme-option {
      display: flex; align-items: center; gap: 0.65rem; width: 100%;
      border: 0; border-radius: 8px; padding: 0.55rem 0.65rem;
      color: var(--ink); background: transparent; cursor: pointer;
      font-family: var(--font-cjk); font-size: 0.84rem; text-align: left;
    }
    .theme-option:hover, .theme-option:focus-visible { color: var(--accent); background: var(--bg2); outline: none; }
    .theme-swatch {
      width: 0.85rem; height: 0.85rem; flex: 0 0 auto; border-radius: 50%;
      border: 1px solid var(--rule); background: var(--swatch);
    }
    .theme-option::after { content: ''; margin-left: auto; color: var(--accent); font-weight: 700; }
    .theme-option[aria-checked="true"]::after { content: '✓'; }

    /* Interactive badge / section tag */
    .live-tag {
      display: inline-flex; align-items: center; gap: 0.35rem;
      font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--accent); background: var(--bg2);
      border: 1px solid var(--rule); border-radius: 999px; padding: 0.15rem 0.6rem;
      vertical-align: middle; margin-left: 0.6rem;
    }
    .live-tag::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.8s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

    /* Reveal-answer for Q&A (active recall) */
    .qa .a { display: none; }
    .qa.revealed .a { display: block; animation: fadeIn 0.35s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
    .qa .q { cursor: pointer; user-select: none; }
    .reveal-hint {
      font-family: var(--font-mono); font-size: 0.72rem; color: var(--accent);
      margin-left: auto; align-self: center; white-space: nowrap;
    }
    .qa.revealed .reveal-hint { color: var(--muted); }
    .qa .q .difficulty { margin-left: 0.6rem; }

    /* Code copy button */
    .code-wrap { position: relative; }
    .copy-btn {
      position: absolute; top: 0.7rem; right: 0.7rem; z-index: 3;
      font-family: var(--font-mono); font-size: 0.7rem; color: #9fb0b6;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px; padding: 0.2rem 0.6rem; cursor: pointer; transition: all 0.2s;
    }
    .copy-btn:hover { color: #fff; background: rgba(255,255,255,0.14); }
    .copy-btn.done { color: #6fd3c8; border-color: #6fd3c8; }

    /* ===== Interactive block shell ===== */
    .interactive {
      background: var(--bg2); border: 1px solid var(--rule); border-radius: 14px;
      padding: 1.6rem 1.7rem; margin: 2rem 0; font-family: var(--font-cjk);
      position: relative; overflow: hidden;
    }
    .interactive::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
      background: linear-gradient(180deg, var(--accent), var(--accent2));
    }
    .interactive .ix-title {
      font-family: var(--font-head); font-weight: 700; font-size: 1.15rem; color: var(--ink);
      margin-bottom: 0.3rem; display: flex; align-items: center; gap: 0.5rem;
    }
    .interactive .ix-sub { font-size: 0.9rem; color: var(--muted); margin-bottom: 1.2rem; }
    .hub-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1rem; }
    .hub-card { position: relative; }
    .hub-eyebrow {
      font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--accent2); margin-bottom: 0.5rem;
    }
    .meta-row { display: flex; flex-wrap: wrap; gap: 0.45rem; margin: 0.8rem 0 0.95rem; }
    .meta-pill {
      font-family: var(--font-mono); font-size: 0.72rem; line-height: 1.2; color: var(--accent);
      background: var(--bg); border: 1px solid var(--rule); border-radius: 999px; padding: 0.2rem 0.55rem;
    }
    .hub-list { margin: 0.8rem 0 0; padding-left: 1.1rem; color: var(--muted); font-size: 0.9rem; }
    .hub-list li { margin-bottom: 0.35rem; }
    .hub-action { display: flex; flex-wrap: wrap; gap: 0.7rem; margin-top: 1rem; align-items: center; }
    .hub-link {
      color: var(--accent); font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 0.25rem;
    }
    .hub-link:hover { color: var(--accent2); }
    .hub-fit { font-size: 0.85rem; color: var(--muted); }
    .cite {
      font-family: var(--font-mono); font-size: 0.72rem; text-decoration: none;
      color: var(--accent2); vertical-align: super; margin: 0 0.1rem;
      border-bottom: 1px dotted var(--accent2);
    }
    .cite:hover { color: var(--accent); }

    /* ===== Insight wall (大牛观点) ===== */
    .insight-filter { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.1rem; }
    .insight-chip {
      font-family: var(--font-cjk); font-size: 0.82rem; color: var(--ink);
      background: var(--bg); border: 1px solid var(--rule); border-radius: 999px;
      padding: 0.32rem 0.85rem; cursor: pointer; transition: all 0.18s;
    }
    .insight-chip:hover { border-color: var(--accent); }
    .insight-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .insight-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
    .insight-card {
      position: relative; background: var(--card); border: 1px solid var(--rule);
      border-radius: 14px; padding: 1.2rem 1.25rem 1.1rem; overflow: hidden;
      transition: transform 0.18s, box-shadow 0.18s;
    }
    .insight-card:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(13,125,114,0.1); }
    .insight-card::before {
      content: '\201C'; position: absolute; top: -0.5rem; right: 0.8rem;
      font-family: var(--font-head); font-size: 4rem; line-height: 1; color: var(--rule); opacity: 0.5;
    }
    .insight-theme {
      display: inline-block; font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.05em;
      color: var(--accent2); background: var(--bg); border: 1px solid var(--rule);
      border-radius: 6px; padding: 0.12rem 0.5rem; margin-bottom: 0.7rem;
    }
    .insight-punch {
      font-family: var(--font-head); font-weight: 700; font-size: 1.12rem; line-height: 1.5;
      color: var(--ink); margin-bottom: 0.7rem; position: relative; z-index: 1;
    }
    .insight-detail { font-size: 0.9rem; color: var(--muted); line-height: 1.75; margin-bottom: 0.85rem; }
    .insight-takeaway {
      font-size: 0.86rem; color: var(--ink); line-height: 1.7; background: var(--bg);
      border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 0.6rem 0.8rem; margin-bottom: 0.85rem;
    }
    .insight-takeaway b { color: var(--accent); }
    .insight-foot { display: flex; align-items: baseline; justify-content: space-between; gap: 0.6rem; flex-wrap: wrap; }
    .insight-author { font-weight: 700; color: var(--ink); font-size: 0.92rem; }
    .insight-role { font-size: 0.76rem; color: var(--muted); }

    /* ===== 双向锚点：观点墙 -> 章节 的正向链接 ===== */
    .insight-jump {
      display: inline-flex; align-items: center; gap: 0.3rem;
      margin-top: 0.85rem; padding: 0.4rem 0.7rem;
      font-size: 0.82rem; font-weight: 600; text-decoration: none;
      color: var(--accent); background: rgba(13,125,114,0.08);
      border: 1px solid rgba(13,125,114,0.22); border-radius: 8px;
      transition: background 0.18s, transform 0.18s;
    }
    .insight-jump:hover { background: rgba(13,125,114,0.16); transform: translateX(2px); }

    /* ===== 双向锚点：章节 -> 观点墙 的反向链接条 ===== */
    .interactive-mini { margin: 0.6rem 0 1.1rem; }
    .insight-backlink {
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.55rem;
      padding: 0.75rem 0.9rem; border-radius: 12px;
      background: var(--bg2); border: 1px solid var(--rule);
    }
    .backlink-label { font-family: var(--font-head); font-weight: 700; font-size: 0.84rem; color: var(--ink); flex: 0 0 auto; }
    .backlink-chip {
      font-family: var(--font-cjk); font-size: 0.82rem; line-height: 1.4;
      text-align: left; text-decoration: none; cursor: pointer;
      max-width: 100%; padding: 0.4rem 0.7rem;
      color: var(--muted); background: var(--bg);
      border: 1px solid var(--rule); border-radius: 999px;
      transition: color 0.18s, border-color 0.18s, background 0.18s;
    }
    .backlink-chip:hover { color: var(--accent); border-color: var(--accent); background: rgba(13,125,114,0.06); }

    /* 被反向链接定位时，观点卡片的高亮闪烁 */
    @keyframes insightFlash {
      0% { box-shadow: 0 0 0 0 rgba(13,125,114,0.55); }
      30% { box-shadow: 0 0 0 4px rgba(13,125,114,0.35); }
      100% { box-shadow: 0 0 0 0 rgba(13,125,114,0); }
    }
    .insight-card.insight-flash {
      animation: insightFlash 1.1s ease-out 2;
      border-color: var(--accent);
    }

    /* ===== Quiz ===== */
    .quiz-q { margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px dashed var(--rule); }
    .quiz-q:last-of-type { border-bottom: none; }
    .quiz-q .stem { font-weight: 700; color: var(--ink); margin-bottom: 0.8rem; display: flex; gap: 0.5rem; }
    .quiz-q .stem .qn { color: var(--accent); font-family: var(--font-mono); }
    .quiz-opt {
      display: block; width: 100%; text-align: left; margin: 0.45rem 0;
      background: var(--bg); border: 1px solid var(--rule); border-radius: 9px;
      padding: 0.7rem 0.95rem; cursor: pointer; font-family: var(--font-cjk);
      font-size: 0.95rem; color: var(--ink); transition: all 0.18s;
    }
    .quiz-opt:hover:not(:disabled) { border-color: var(--accent); transform: translateX(2px); }
    .quiz-opt .mk { font-family: var(--font-mono); color: var(--muted); margin-right: 0.6rem; }
    .quiz-opt.correct { background: rgba(46,125,50,0.12); border-color: #2e7d32; color: var(--ink); }
    .quiz-opt.wrong { background: rgba(192,57,43,0.1); border-color: #c0392b; }
    .quiz-opt.correct .mk { color: #2e7d32; }
    .quiz-opt.wrong .mk { color: #c0392b; }
    .quiz-opt:disabled { cursor: default; }
    .quiz-exp {
      display: none; margin-top: 0.7rem; padding: 0.75rem 1rem; border-radius: 8px;
      background: var(--bg); border-left: 3px solid var(--accent2); font-size: 0.9rem; color: var(--muted);
    }
    .quiz-exp.show { display: block; animation: fadeIn 0.3s ease; }
    .quiz-exp b { color: var(--accent2); }
    .quiz-score {
      margin-top: 1.2rem; padding: 1rem 1.2rem; border-radius: 10px; background: var(--bg);
      border: 1px solid var(--rule); font-weight: 700; color: var(--ink); display: none;
    }
    .quiz-score.show { display: block; }
    .quiz-score .big { font-family: var(--font-head); font-size: 1.6rem; color: var(--accent); }
    .btn {
      font-family: var(--font-cjk); font-weight: 700; font-size: 0.9rem; color: #fff;
      background: var(--accent); border: none; border-radius: 8px; padding: 0.55rem 1.2rem;
      cursor: pointer; transition: all 0.2s; margin-top: 0.5rem;
    }
    .btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }

    /* ===== Framework selector wizard ===== */
    .wizard-step { display: none; }
    .wizard-step.active { display: block; animation: fadeIn 0.3s ease; }
    .wizard-q { font-weight: 700; color: var(--ink); margin-bottom: 0.9rem; font-size: 1.02rem; }
    .wizard-opt {
      display: block; width: 100%; text-align: left; margin: 0.5rem 0;
      background: var(--bg); border: 1px solid var(--rule); border-radius: 9px;
      padding: 0.75rem 1rem; cursor: pointer; font-family: var(--font-cjk); color: var(--ink);
      font-size: 0.95rem; transition: all 0.18s;
    }
    .wizard-opt:hover { border-color: var(--accent); background: var(--bg2); transform: translateX(3px); }
    .wizard-progress { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); margin-bottom: 0.8rem; }
    .wizard-result { display: none; }
    .wizard-result.show { display: block; animation: fadeIn 0.35s ease; }
    .wizard-result .rec {
      font-family: var(--font-head); font-weight: 700; font-size: 1.5rem; color: var(--accent);
      margin-bottom: 0.5rem;
    }
    .wizard-result .why { font-size: 0.95rem; color: var(--ink); margin-bottom: 1rem; }

    /* ===== Case library + scenario builder ===== */
    .case-tab-group {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.8rem; margin-bottom: 1rem;
    }
    .case-tab {
      display: flex; flex-direction: column; gap: 0.3rem; text-align: left;
      background: var(--bg); border: 1px solid var(--rule); border-radius: 12px;
      padding: 0.95rem 1rem; cursor: pointer; transition: all 0.2s;
      font-family: var(--font-cjk); color: var(--ink);
    }
    .case-tab:hover { border-color: var(--accent); transform: translateY(-1px); }
    .case-tab.active {
      border-color: var(--accent);
      box-shadow: 0 8px 22px rgba(13,125,114,0.12);
      background: linear-gradient(180deg, rgba(13,125,114,0.06), rgba(255,255,255,0.01));
    }
    .case-tab-label {
      font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--accent2);
    }
    .case-tab-title { font-weight: 700; font-size: 1rem; color: var(--ink); }
    .case-tab-summary { font-size: 0.86rem; color: var(--muted); line-height: 1.5; }
    .case-detail-shell { display: grid; gap: 1rem; }
    .case-hero {
      display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(220px, 0.75fr);
      gap: 1rem; align-items: start;
    }
    .case-hero-copy h4 { margin-bottom: 0.45rem; }
    .case-callout {
      background: var(--bg); border: 1px solid var(--rule); border-radius: 12px;
      padding: 1rem 1.05rem; color: var(--ink); font-size: 0.92rem; line-height: 1.7;
    }
    .case-callout strong { color: var(--accent2); }
    .case-detail-grid { align-items: stretch; }
    .case-section { padding: 1rem 1.05rem; }
    .case-section h5 {
      margin: 0 0 0.55rem; font-size: 1rem; color: var(--ink);
      font-family: var(--font-head);
    }
    .case-section p { margin: 0; color: var(--muted); line-height: 1.7; }
    .case-section .hub-list { margin-top: 0.2rem; }
    .scenario-option-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.8rem; margin: 1rem 0;
    }
    .scenario-option {
      display: flex; flex-direction: column; gap: 0.35rem; text-align: left;
      background: var(--bg); border: 1px solid var(--rule); border-radius: 12px;
      padding: 0.95rem 1rem; cursor: pointer; transition: all 0.2s;
      font-family: var(--font-cjk); color: var(--ink);
    }
    .scenario-option:hover { border-color: var(--accent); transform: translateY(-1px); }
    .scenario-option.active {
      border-color: var(--accent);
      background: linear-gradient(180deg, rgba(13,125,114,0.08), rgba(255,255,255,0.01));
      box-shadow: 0 8px 22px rgba(13,125,114,0.12);
    }
    .scenario-option-title { font-weight: 700; color: var(--ink); }
    .scenario-option-hint { font-size: 0.86rem; color: var(--muted); line-height: 1.55; }
    .scenario-result-box,
    .scenario-empty {
      margin-top: 1rem; padding: 1rem 1.05rem; border-radius: 12px;
      background: var(--bg); border: 1px solid var(--rule);
    }
    .scenario-result-box h4,
    .scenario-empty h4 { margin-bottom: 0.45rem; }
    .scenario-rationale { margin: 0.9rem 0; color: var(--ink); font-size: 0.92rem; line-height: 1.7; }

    /* ===== ReAct stepper ===== */
    .stepper { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1rem 0; }
    .step-dot {
      flex: 1 1 0; min-width: 120px; background: var(--bg); border: 1px solid var(--rule);
      border-radius: 9px; padding: 0.7rem 0.9rem; opacity: 0.4; transition: all 0.3s;
    }
    .step-dot.on { opacity: 1; border-color: var(--accent); box-shadow: 0 4px 14px rgba(13,125,114,0.12); }
    .step-dot .st-k { font-family: var(--font-mono); font-size: 0.7rem; color: var(--accent); text-transform: uppercase; }
    .step-dot .st-t { font-weight: 700; color: var(--ink); font-size: 0.92rem; margin: 0.2rem 0; }
    .step-dot .st-d { font-size: 0.82rem; color: var(--muted); }
    .stepper-ctl { display: flex; gap: 0.6rem; align-items: center; margin-top: 0.6rem; }

    /* ===== Glossary search ===== */
    .glossary-search {
      width: 100%; font-family: var(--font-cjk); font-size: 0.98rem; color: var(--ink);
      background: var(--bg); border: 1px solid var(--rule); border-radius: 9px;
      padding: 0.7rem 1rem; margin-bottom: 1rem; outline: none; transition: border-color 0.2s;
    }
    .glossary-search:focus { border-color: var(--accent); }
    .glossary-list { display: grid; gap: 0.6rem; }
    .glossary-item {
      background: var(--bg); border: 1px solid var(--rule); border-radius: 9px; padding: 0.8rem 1rem;
    }
    .glossary-item .term { font-family: var(--font-head); font-weight: 700; color: var(--accent); font-size: 0.98rem; }
    .glossary-item .term .en { color: var(--muted); font-family: var(--font-mono); font-size: 0.8rem; font-weight: 400; margin-left: 0.4rem; }
    .glossary-item .def { font-size: 0.9rem; color: var(--ink); margin-top: 0.25rem; }
    .glossary-empty { color: var(--muted); font-size: 0.9rem; padding: 0.8rem; text-align: center; }

    /* ===== Checklist with localStorage ===== */
    .checklist { list-style: none; margin: 0.5rem 0 0; }
    .checklist li { margin-bottom: 0.55rem; }
    .checklist label {
      display: flex; align-items: flex-start; gap: 0.65rem; cursor: pointer;
      font-size: 0.95rem; color: var(--ink); padding: 0.5rem 0.7rem; border-radius: 8px;
      border: 1px solid transparent; transition: all 0.15s;
    }
    .checklist label:hover { background: var(--bg); border-color: var(--rule); }
    .checklist input { display: none; }
    .checklist .box {
      flex: 0 0 auto; width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--rule);
      display: inline-flex; align-items: center; justify-content: center; margin-top: 1px; transition: all 0.2s;
    }
    .checklist .box::after { content: '✓'; color: #fff; font-size: 0.8rem; opacity: 0; transform: scale(0.5); transition: all 0.2s; }
    .checklist input:checked + .box { background: var(--accent); border-color: var(--accent); }
    .checklist input:checked + .box::after { opacity: 1; transform: scale(1); }
    .checklist input:checked ~ .ct { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--rule); }
    .progress-ring-wrap { display: flex; align-items: center; gap: 1rem; margin: 0.5rem 0 1rem; }
    .progress-track { flex: 1; height: 10px; background: var(--bg); border-radius: 999px; overflow: hidden; border: 1px solid var(--rule); }
    .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 0.4s ease; }
    .progress-pct { font-family: var(--font-head); font-weight: 700; color: var(--accent); font-size: 1.1rem; min-width: 3.5rem; text-align: right; }

    /* mini heading inside hub cards */
    .mini-h { font-family: var(--font-head); font-weight: 700; font-size: 0.82rem; color: var(--ink); margin: 0.85rem 0 0.15rem; letter-spacing: 0.01em; }

    /* Decision list (finetune decision tree) */
    .decision-list { list-style: none; counter-reset: dstep; margin: 0.4rem 0 0; padding: 0; display: grid; gap: 0.9rem; }
    .decision-step { border: 1px solid var(--rule); border-radius: 12px; padding: 1rem 1.1rem; background: var(--bg2); }
    .decision-q { font-family: var(--font-head); font-weight: 700; color: var(--ink); margin-bottom: 0.7rem; font-size: 0.98rem; }
    .decision-branch { display: flex; gap: 0.6rem; align-items: flex-start; font-size: 0.9rem; color: var(--muted); padding: 0.4rem 0.6rem; border-radius: 8px; line-height: 1.55; }
    .decision-branch + .decision-branch { margin-top: 0.4rem; }
    .decision-yes { background: rgba(46,125,50,0.08); }
    .decision-no { background: rgba(176,110,40,0.08); }
    .branch-tag { flex: 0 0 auto; font-family: var(--font-head); font-weight: 700; font-size: 0.8rem; }
    .decision-yes .branch-tag { color: #2e7d32; }
    .decision-no .branch-tag { color: #b06e28; }

    /* Coding Agent trace timeline */
    .trace-shell { display: grid; grid-template-columns: minmax(190px, 260px) 1fr; gap: 1.2rem; align-items: start; }
    .trace-rail { display: flex; flex-direction: column; gap: 0.2rem; position: relative; }
    .trace-node { display: flex; align-items: center; gap: 0.6rem; text-align: left; background: transparent; border: none; cursor: pointer; padding: 0.55rem 0.6rem; border-radius: 8px; color: var(--muted); font-family: var(--font-cjk); font-size: 0.9rem; transition: all 0.18s; }
    .trace-node:hover { background: var(--bg2); color: var(--ink); }
    .trace-node.active { background: var(--bg2); color: var(--accent); font-weight: 700; }
    .trace-dot { flex: 0 0 auto; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--rule); background: var(--bg); transition: all 0.18s; }
    .trace-node.active .trace-dot { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 0 4px rgba(0,0,0,0.04); }
    .trace-node-title { line-height: 1.3; }
    .trace-detail { margin: 0; }
    .trace-detail h4 { margin: 0 0 0.5rem; font-size: 1.05rem; }
    .trace-detail p { font-size: 0.92rem; color: var(--muted); margin: 0 0 0.3rem; line-height: 1.65; }

    /* Back to top */
    .to-top {
      position: fixed; right: 1.4rem; bottom: 1.4rem; z-index: 150;
      width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--rule);
      background: var(--bg2); color: var(--accent); cursor: pointer; font-size: 1.1rem;
      display: none; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(0,0,0,0.12);
      transition: all 0.2s;
    }
    .to-top:hover { transform: translateY(-2px); border-color: var(--accent); }
    .to-top.show { display: flex; }

    @media (max-width: 768px) {
      .cover-inner { padding: 4rem 1.2rem 3rem; }
      .part-divider-inner { flex-direction: column; text-align: center; gap: 0.8rem; padding: 1.8rem 1.4rem; }
      .topnav-inner { position: relative; padding: 0.55rem 0.8rem; }
      .topnav .book-nav { display: none; }
      .mobile-book-toggle { display: inline-flex; }
      .mobile-book-nav {
        display: block; position: fixed; z-index: 240; top: 3.45rem; right: 0.65rem;
        width: min(22rem, calc(100vw - 1.3rem)); max-height: calc(100vh - 4.2rem); overflow-y: auto;
        padding: 0.65rem; border: 1px solid var(--rule); border-radius: 12px;
        background: var(--bg); box-shadow: 0 16px 38px rgba(0,0,0,0.2); font-family: var(--font-cjk);
      }
      .mobile-part-trigger {
        width: 100%; padding: 0.62rem 0.7rem; border: 0; border-radius: 8px;
        background: transparent; color: var(--ink); text-align: left; cursor: pointer;
        font-family: var(--font-head); font-weight: 700;
      }
      .mobile-part-trigger::after { content: '＋'; float: right; color: var(--muted); }
      .mobile-part-trigger[aria-expanded="true"]::after { content: '－'; }
      .mobile-part-trigger:hover, .mobile-part-trigger[aria-expanded="true"] { color: var(--accent); background: var(--bg2); }
      .mobile-part-links { padding: 0.2rem 0 0.45rem 0.4rem; }
      .mobile-part-links a, .mobile-resource {
        display: flex; gap: 0.55rem; padding: 0.45rem 0.65rem; color: var(--muted);
        text-decoration: none; border-radius: 7px; font-size: 0.86rem;
      }
      .mobile-part-links a:hover, .mobile-part-links a.active, .mobile-resource:hover {
        color: var(--accent); background: var(--bg2);
      }
      .outline-toggle {
        display: none; position: fixed; z-index: 180; right: 0.85rem; bottom: 4.8rem;
        border: 1px solid var(--accent); border-radius: 999px; padding: 0.48rem 0.8rem;
        background: var(--bg); color: var(--accent); box-shadow: 0 8px 22px rgba(0,0,0,0.14);
        font-family: var(--font-cjk); font-size: 0.78rem; cursor: pointer;
      }
      .outline-toggle.has-items { display: block; }
      .mobile-outline {
        display: block; position: fixed; z-index: 190; right: 0.65rem; bottom: 7.8rem;
        width: min(21rem, calc(100vw - 1.3rem)); max-height: 55vh; overflow-y: auto;
        padding: 0.75rem; border: 1px solid var(--rule); border-radius: 12px;
        background: var(--bg); box-shadow: 0 16px 38px rgba(0,0,0,0.2);
        font-family: var(--font-cjk);
      }
      .mobile-outline .outline-link { font-size: 0.86rem; padding: 0.5rem 0.6rem; }
      section.chapter { padding: 2.4rem 0 0.5rem; }
      .interactive { padding: 1.3rem 1.2rem; }
      .case-hero { grid-template-columns: 1fr; }
      .reveal-hint { display: none; }
      .theme-menu { position: fixed; top: 3.6rem; right: 0.75rem; width: min(11.5rem, calc(100vw - 1.5rem)); }
    }

    /* ===== 学习者友好增强层（learner-guide.js） ===== */
    /* 章首导学卡 */
    .lg-opener {
      background: linear-gradient(180deg, var(--bg2), transparent);
      border: 1px solid var(--rule); border-left: 4px solid var(--accent);
      border-radius: 12px; padding: 1.15rem 1.3rem 1.2rem;
      margin: 0 0 1.6rem; font-family: var(--font-cjk);
    }
    .lg-meta { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.9rem; }
    .lg-badge {
      display: inline-flex; align-items: center; gap: 0.3rem;
      font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.03em;
      padding: 0.2rem 0.62rem; border-radius: 999px; border: 1px solid var(--rule);
      color: var(--muted); background: var(--bg); white-space: nowrap;
    }
    .lg-badge.lg-easy { color: #1f8a4c; border-color: #b9e2c7; background: #eef8f1; }
    .lg-badge.lg-mid  { color: #b7791a; border-color: #ecd6a3; background: #fbf3df; }
    .lg-badge.lg-hard { color: #c0503f; border-color: #ecc0b8; background: #fbeae6; }
    .lg-hook {
      font-size: 1rem; line-height: 1.75; color: var(--ink); margin-bottom: 0.95rem;
    }
    .lg-hook-mark {
      display: inline-block; font-family: var(--font-head); font-weight: 700;
      font-size: 0.72rem; letter-spacing: 0.06em; color: #fff; background: var(--accent);
      padding: 0.08rem 0.5rem; border-radius: 5px; margin-right: 0.55rem; vertical-align: 0.08em;
    }
    .lg-goals-t {
      font-family: var(--font-head); font-weight: 700; font-size: 0.94rem;
      color: var(--accent); margin-bottom: 0.45rem;
    }
    .lg-list { margin: 0 0 0 1.15rem; padding: 0; }
    .lg-list li { font-size: 0.96rem; line-height: 1.7; margin-bottom: 0.28rem; }
    .lg-goals .lg-list li::marker { color: var(--accent2); }

    /* 章末小结卡 */
    .lg-summary {
      margin: 2.2rem 0 0.6rem; padding: 1.2rem 1.35rem 1.3rem;
      background: var(--bg2); border: 1px solid var(--rule); border-radius: 12px;
      font-family: var(--font-cjk); position: relative;
    }
    .lg-summary.is-read { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
    .lg-sum-head {
      font-family: var(--font-head); font-weight: 700; font-size: 1.02rem;
      color: var(--ink); margin-bottom: 0.6rem;
    }
    .lg-summary .lg-list li { font-size: 0.97rem; margin-bottom: 0.4rem; }
    .lg-summary .lg-list li::marker { color: var(--accent); }

    /* 上/下章导航 + 标记学完 */
    .lg-nav {
      display: grid; grid-template-columns: 1fr auto 1fr; gap: 0.7rem;
      align-items: stretch; margin-top: 1.15rem; padding-top: 1rem;
      border-top: 1px dashed var(--rule);
    }
    .lg-nav-btn {
      display: flex; flex-direction: column; gap: 0.15rem; justify-content: center;
      text-decoration: none; border: 1px solid var(--rule); border-radius: 10px;
      padding: 0.55rem 0.8rem; background: var(--bg); transition: all 0.18s; min-height: 48px;
    }
    .lg-nav-btn.next { text-align: right; }
    .lg-nav-btn span { font-family: var(--font-mono); font-size: 0.7rem; color: var(--accent); }
    .lg-nav-btn b { font-family: var(--font-cjk); font-size: 0.9rem; color: var(--ink); font-weight: 700; line-height: 1.3; }
    .lg-nav-btn:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,0.06); }
    .lg-nav-btn.ghost { border: none; background: transparent; box-shadow: none; transform: none; }
    .lg-read-btn {
      align-self: center; font-family: var(--font-cjk); font-size: 0.82rem; cursor: pointer;
      border: 1px solid var(--accent); color: var(--accent); background: transparent;
      border-radius: 999px; padding: 0.4rem 0.95rem; white-space: nowrap; transition: all 0.18s;
    }
    .lg-read-btn:hover { background: var(--accent); color: #fff; }
    .lg-read-btn.done { background: var(--accent); color: #fff; }

    /* 顶栏字号调节 */
    .lg-font { display: inline-flex; gap: 0.3rem; }
    .lg-font-btn { font-family: var(--font-mono); padding: 0.3rem 0.55rem; }

    /* 深色模式适配 */
    html[data-theme="dark"] .lg-opener { background: linear-gradient(180deg, var(--bg2), transparent); }
    html[data-theme="dark"] .lg-badge.lg-easy { color: #74d68a; border-color: #1f4a30; background: #14291c; }
    html[data-theme="dark"] .lg-badge.lg-mid  { color: #e3b74e; border-color: #4a3c17; background: #2a2210; }
    html[data-theme="dark"] .lg-badge.lg-hard { color: #e78a7f; border-color: #4a2723; background: #2c1917; }

    @media (max-width: 768px) {
      .lg-nav { grid-template-columns: 1fr; }
      .lg-nav-btn.next { text-align: left; }
      .lg-read-btn { order: -1; }
      .lg-font { display: none; }
    }

    /* 打印 / PDF：隐藏交互按钮，保留导学与小结内容 */
    @media print {
      .lg-read-btn, .lg-nav .lg-nav-btn.ghost,
      .nav-dropdown, .chapter-outline, .mobile-book-toggle,
      .mobile-book-nav, .outline-toggle, .mobile-outline { display: none !important; }
      .lg-opener, .lg-summary { break-inside: avoid; page-break-inside: avoid; }
      .lg-nav-btn:hover { transform: none; box-shadow: none; }
    }
  </style>
</head>

  <script>
    if (window.mermaid) {
      mermaid.initialize({ startOnLoad: true, theme: 'neutral', securityLevel: 'loose' });
    }
  </script>
  <script src="{{ASSET_PREFIX}}/assets/charts.js"></script>
  <script src="{{ASSET_PREFIX}}/assets/handbook-data.js"></script>
  <script src="{{ASSET_PREFIX}}/assets/handbook-interactions.js"></script>
  <script src="{{ASSET_PREFIX}}/assets/learner-guide.js"></script>
  <script>
  /* ============ INTERACTIVE ENGINE ============ */
  (function () {
    'use strict';
    var $  = function (s, r) { return (r || document).querySelector(s); };
    var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

    /* ---------- 1. Theme menu ---------- */
    (function () {
      var btn = $('#themeToggle');
      var menu = $('#themeMenu');
      var root = document.documentElement;
      var options = menu ? $$('.theme-option', menu) : [];
      var themes = ['paper', 'warm', 'mist', 'dark'];
      var saved = null;
      try { saved = localStorage.getItem('ah-theme'); } catch (e) {}
      var theme = saved === 'light' ? 'paper' : saved;
      if (themes.indexOf(theme) === -1) theme = 'paper';

      function apply(next, persist) {
        theme = next;
        root.dataset.theme = theme;
        options.forEach(function (option) {
          option.setAttribute('aria-checked', option.getAttribute('data-theme-value') === theme ? 'true' : 'false');
        });
        if (persist) {
          try { localStorage.setItem('ah-theme', theme); } catch (e) {}
        }
        if (window.__ah_recolorCharts) window.__ah_recolorCharts(theme === 'dark');
      }
      function closeMenu(returnFocus) {
        if (!menu || !btn) return;
        menu.hidden = true;
        btn.setAttribute('aria-expanded', 'false');
        if (returnFocus) btn.focus();
      }
      function openMenu() {
        if (!menu || !btn) return;
        menu.hidden = false;
        btn.setAttribute('aria-expanded', 'true');
        var current = options.filter(function (option) { return option.getAttribute('aria-checked') === 'true'; })[0];
        if (current) current.focus();
      }

      apply(theme, saved !== theme);
      if (btn && menu) {
        btn.addEventListener('click', function () {
          if (menu.hidden) openMenu(); else closeMenu(false);
        });
        menu.addEventListener('click', function (event) {
          var option = event.target.closest ? event.target.closest('[data-theme-value]') : null;
          if (!option) return;
          apply(option.getAttribute('data-theme-value'), true);
          closeMenu(true);
        });
        document.addEventListener('click', function (event) {
          if (menu.hidden || btn.contains(event.target) || menu.contains(event.target)) return;
          closeMenu(false);
        });
        document.addEventListener('keydown', function (event) {
          if (event.key === 'Escape' && !menu.hidden) closeMenu(true);
        });
      }
    })();

    /* ---------- 2. Reading progress bar ---------- */
    (function () {
      var bar = $('#progressBar');
      if (!bar) return;
      function upd() {
        var h = document.documentElement;
        var max = h.scrollHeight - h.clientHeight;
        var pct = max > 0 ? (h.scrollTop || document.body.scrollTop) / max * 100 : 0;
        bar.style.width = pct + '%';
      }
      window.addEventListener('scroll', upd, { passive: true });
      window.addEventListener('resize', upd);
      upd();
    })();

    /* ---------- 3. Back to top ---------- */
    (function () {
      var b = $('#toTop');
      if (!b) return;
      window.addEventListener('scroll', function () {
        if ((window.scrollY || 0) > 600) b.classList.add('show'); else b.classList.remove('show');
      }, { passive: true });
      b.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
    })();

    /* ---------- 4. Layered book and chapter navigation ---------- */
    (function () {
      var groups = $$('.nav-group');
      var chapterLinks = $$('[data-chapter-id]');
      var chapters = $$('section.chapter');
      var parts = groups.map(function (group) {
        return document.getElementById(group.getAttribute('data-part-id'));
      }).filter(Boolean);
      var chapterOutline = $('#chapterOutline');
      var desktopOutlineLinks = chapterOutline ? $('.chapter-outline-links', chapterOutline) : null;
      var mobileBookToggle = $('#mobileBookToggle');
      var mobileBookNav = $('#mobileBookNav');
      var mobileOutlineToggle = $('#mobileOutlineToggle');
      var mobileOutline = $('#mobileOutline');
      var currentChapter = null;
      var currentHeading = null;
      var ticking = false;

      function setGroupOpen(group, open) {
        var trigger = $('.nav-trigger', group);
        group.classList.toggle('is-open', open);
        if (trigger) trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
      }
      function closeDesktop(returnFocus) {
        groups.forEach(function (group) {
          var wasOpen = group.classList.contains('is-open');
          setGroupOpen(group, false);
          if (returnFocus && wasOpen) {
            var trigger = $('.nav-trigger', group);
            if (trigger) trigger.focus();
          }
        });
      }
      groups.forEach(function (group) {
        group.addEventListener('mouseenter', function () { setGroupOpen(group, true); });
        group.addEventListener('mouseleave', function () { setGroupOpen(group, false); });
        group.addEventListener('focusin', function () { setGroupOpen(group, true); });
        group.addEventListener('focusout', function (event) {
          if (!group.contains(event.relatedTarget)) setGroupOpen(group, false);
        });
        group.addEventListener('click', function (event) {
          if (event.target.closest && event.target.closest('.nav-dropdown a')) closeDesktop(false);
        });
      });

      function closeMobileBook(returnFocus) {
        if (!mobileBookNav || !mobileBookToggle) return;
        mobileBookNav.hidden = true;
        mobileBookToggle.setAttribute('aria-expanded', 'false');
        if (returnFocus) mobileBookToggle.focus();
      }
      function closeMobileOutline(returnFocus) {
        if (!mobileOutline || !mobileOutlineToggle) return;
        mobileOutline.hidden = true;
        mobileOutlineToggle.setAttribute('aria-expanded', 'false');
        if (returnFocus) mobileOutlineToggle.focus();
      }
      if (mobileBookToggle && mobileBookNav) {
        mobileBookToggle.addEventListener('click', function () {
          var open = mobileBookNav.hidden;
          closeMobileOutline(false);
          mobileBookNav.hidden = !open;
          mobileBookToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
        $$('.mobile-part-trigger', mobileBookNav).forEach(function (button) {
          button.addEventListener('click', function () {
            var panel = document.getElementById(button.getAttribute('aria-controls'));
            var open = panel && panel.hidden;
            $$('.mobile-part-trigger', mobileBookNav).forEach(function (other) {
              var otherPanel = document.getElementById(other.getAttribute('aria-controls'));
              other.setAttribute('aria-expanded', 'false');
              if (otherPanel) otherPanel.hidden = true;
            });
            if (panel && open) {
              panel.hidden = false;
              button.setAttribute('aria-expanded', 'true');
            }
          });
        });
        mobileBookNav.addEventListener('click', function (event) {
          if (event.target.closest && event.target.closest('a')) closeMobileBook(false);
        });
      }
      if (mobileOutlineToggle && mobileOutline) {
        mobileOutlineToggle.addEventListener('click', function () {
          var open = mobileOutline.hidden;
          closeMobileBook(false);
          mobileOutline.hidden = !open;
          mobileOutlineToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
        mobileOutline.addEventListener('click', function (event) {
          if (event.target.closest && event.target.closest('a')) closeMobileOutline(false);
        });
      }
      document.addEventListener('click', function (event) {
        if (mobileBookNav && !mobileBookNav.hidden &&
            !mobileBookNav.contains(event.target) && !mobileBookToggle.contains(event.target)) {
          closeMobileBook(false);
        }
        if (mobileOutline && !mobileOutline.hidden &&
            !mobileOutline.contains(event.target) && !mobileOutlineToggle.contains(event.target)) {
          closeMobileOutline(false);
        }
      });
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
          closeDesktop(true);
          if (mobileBookNav && !mobileBookNav.hidden) closeMobileBook(true);
          if (mobileOutline && !mobileOutline.hidden) closeMobileOutline(true);
        }
      });

      function makeOutlineLink(heading) {
        var link = document.createElement('a');
        link.className = 'outline-link';
        link.href = '#' + heading.id;
        link.textContent = heading.textContent.trim();
        link.title = link.textContent;
        return link;
      }
      function renderOutline(chapter) {
        var headings = chapter ? $$('h3[id]', chapter) : [];
        [desktopOutlineLinks, mobileOutline].forEach(function (container) {
          if (!container) return;
          container.innerHTML = '';
          headings.forEach(function (heading) { container.appendChild(makeOutlineLink(heading)); });
        });
        if (chapterOutline) chapterOutline.classList.toggle('has-items', headings.length > 0);
        if (mobileOutlineToggle) mobileOutlineToggle.classList.toggle('has-items', headings.length > 0);
        if (!headings.length) closeMobileOutline(false);
      }
      function nearestAtTop(nodes, offset) {
        var selected = null;
        nodes.forEach(function (node) {
          if (node.getBoundingClientRect().top <= offset) selected = node;
        });
        return selected;
      }
      function updateActive() {
        ticking = false;
        var chapter = nearestAtTop(chapters, 160);
        if (chapter !== currentChapter) {
          currentChapter = chapter;
          renderOutline(chapter);
        }
        var headings = chapter ? $$('h3[id]', chapter) : [];
        var heading = nearestAtTop(headings, 115);
        currentHeading = heading;

        chapterLinks.forEach(function (link) {
          link.classList.toggle('active', Boolean(chapter && link.getAttribute('data-chapter-id') === chapter.id));
        });
        var part = nearestAtTop(parts, 160);
        groups.forEach(function (group) {
          var trigger = $('.nav-trigger', group);
          var ownsChapter = Boolean(chapter && $('[data-chapter-id="' + chapter.id + '"]', group));
          var ownsPart = Boolean(part && group.getAttribute('data-part-id') === part.id);
          if (trigger) trigger.classList.toggle('active', ownsChapter || ownsPart);
        });
        $$('.outline-link').forEach(function (link) {
          var active = Boolean(heading && link.getAttribute('href') === '#' + heading.id);
          link.classList.toggle('active', active);
          if (active) link.setAttribute('aria-current', 'location');
          else link.removeAttribute('aria-current');
        });
      }
      function scheduleUpdate() {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(updateActive);
      }
      if ('IntersectionObserver' in window) {
        var observer = new IntersectionObserver(scheduleUpdate, {
          rootMargin: '-80px 0px -70% 0px',
          threshold: [0, 1],
        });
        chapters.forEach(function (chapter) {
          observer.observe(chapter);
          $$('h3[id]', chapter).forEach(function (heading) { observer.observe(heading); });
        });
      }
      window.addEventListener('scroll', scheduleUpdate, { passive: true });
      window.addEventListener('resize', scheduleUpdate);
      window.addEventListener('hashchange', scheduleUpdate);
      requestAnimationFrame(updateActive);
    })();

    /* ---------- 5. Q&A reveal (active recall) ---------- */
    (function () {
      var cards = $$('.qa');
      cards.forEach(function (card) {
        var q = $('.q', card);
        if (!q) return;
        var hint = document.createElement('span');
        hint.className = 'reveal-hint';
        hint.textContent = '点击查看答案 ▾';
        q.appendChild(hint);
        q.addEventListener('click', function () {
          var open = card.classList.toggle('revealed');
          hint.textContent = open ? '收起 ▴' : '点击查看答案 ▾';
        });
      });
      var all = $('#revealAll');
      if (all) all.addEventListener('click', function () {
        var anyClosed = cards.some(function (c) { return !c.classList.contains('revealed'); });
        cards.forEach(function (c) {
          if (anyClosed) c.classList.add('revealed'); else c.classList.remove('revealed');
          var h = $('.reveal-hint', c);
          if (h) h.textContent = anyClosed ? '收起 ▴' : '点击查看答案 ▾';
        });
        all.textContent = anyClosed ? '全部收起' : '展开全部';
      });
    })();

    /* ---------- 6. Code copy buttons ---------- */
    (function () {
      $$('pre').forEach(function (pre) {
        if (pre.classList.contains('mermaid')) return;
        var wrap = document.createElement('div');
        wrap.className = 'code-wrap';
        pre.parentNode.insertBefore(wrap, pre);
        wrap.appendChild(pre);
        var btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.textContent = '复制';
        wrap.appendChild(btn);
        btn.addEventListener('click', function () {
          var txt = pre.innerText;
          var done = function () { btn.textContent = '已复制 ✓'; btn.classList.add('done'); setTimeout(function () { btn.textContent = '复制'; btn.classList.remove('done'); }, 1600); };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(txt).then(done).catch(function () { fallback(txt, done); });
          } else { fallback(txt, done); }
        });
      });
      function fallback(txt, cb) {
        var ta = document.createElement('textarea');
        ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta); cb();
      }
    })();

    /* ---------- 7. Quizzes ---------- */
    (function () {
      $$('.quiz').forEach(function (quiz) {
        if (quiz.getAttribute('data-quiz-bound') === '1') return;
        var qs = $$('.quiz-q', quiz);
        if (!qs.length) return;
        var total = qs.length, answered = 0, correct = 0;
        var scoreBox = $('.quiz-score', quiz);
        quiz.setAttribute('data-quiz-bound', '1');
        qs.forEach(function (q) {
          var right = parseInt(q.getAttribute('data-correct'), 10);
          var opts = $$('.quiz-opt', q);
          var exp = $('.quiz-exp', q);
          var locked = false;
          opts.forEach(function (opt, i) {
            opt.addEventListener('click', function () {
              if (locked) return;
              locked = true; answered++;
              opts.forEach(function (o) { o.disabled = true; });
              if (i === right) { opt.classList.add('correct'); correct++; }
              else { opt.classList.add('wrong'); opts[right].classList.add('correct'); }
              if (exp) exp.classList.add('show');
              if (answered === total && scoreBox) {
                var pct = Math.round(correct / total * 100);
                var msg = pct === 100 ? '满分！概念很扎实 🎉' : (pct >= 60 ? '不错，错题对应的章节再回炉一下。' : '别灰心，回到对应章节重读一遍就好。');
                scoreBox.innerHTML = '得分 <span class="big">' + correct + '/' + total + '</span>（' + pct + '%）· ' + msg;
                scoreBox.classList.add('show');
              }
            });
          });
        });
      });
    })();

    /* ---------- 8. ReAct stepper ---------- */
    (function () {
      var wrap = $('#reactDemo');
      if (!wrap) return;
      var dots = $$('.step-dot', wrap);
      var next = $('#reactNext'), reset = $('#reactReset'), status = $('#reactStatus');
      var cur = 0;
      function render() {
        dots.forEach(function (d, i) { d.classList.toggle('on', i <= cur); });
        status.textContent = '第 ' + (cur + 1) + ' / ' + dots.length + ' 步';
        next.textContent = cur >= dots.length - 1 ? '完成 ✓' : '下一步 →';
      }
      next.addEventListener('click', function () { if (cur < dots.length - 1) cur++; render(); });
      reset.addEventListener('click', function () { cur = 0; render(); });
      render();
    })();

    /* ---------- 9. Framework selector wizard ---------- */
    (function () {
      var wrap = $('#fwWizard');
      if (!wrap) return;
      var steps = $$('.wizard-step', wrap);
      var result = $('#wizardResult'), recEl = $('#wizardRec'), whyEl = $('#wizardWhy');
      var restart = $('#wizardRestart');
      var recs = {
        'w1':     { rec: '别用 Agent → 写 Workflow', why: '路径确定的任务，用固定编排的 Workflow 更简单、便宜、可靠、易调试，覆盖约 80% 场景。把预算留给真正需要动态决策的地方。' },
        'w-smol': { rec: 'smolagents', why: '抽象极薄、核心约千行，主打 CodeAct（写代码即行动）。最适合学原理和快速原型，学完能平滑迁移到任何重框架。' },
        'w-pyd':  { rec: 'PydanticAI', why: '类型安全 + 依赖注入 + 结构化输出，被称为"Agent 界的 FastAPI"。生产级工程化的首选，产出可直接上线。' },
        'w-crew': { rec: 'CrewAI', why: '角色扮演式多智能体，适合把任务拆给"一支各司其职的团队"。但先确认任务真的需要多角色，否则协调开销会反噬。' },
        'w-lang': { rec: 'LangGraph', why: '图编排、精细控制每个节点与分支，适合复杂有状态工作流。代价是抽象较重——只在确有必要时才上它。' }
      };
      function show(idx) { steps.forEach(function (s, i) { s.classList.toggle('active', i === idx); }); result.classList.remove('show'); }
      function finish(key) {
        var r = recs[key]; if (!r) return;
        steps.forEach(function (s) { s.classList.remove('active'); });
        recEl.textContent = '👉 建议：' + r.rec;
        whyEl.textContent = r.why;
        result.classList.add('show');
      }
      $$('.wizard-opt', wrap).forEach(function (opt) {
        opt.addEventListener('click', function () {
          var nx = opt.getAttribute('data-next');
          if (/^\d+$/.test(nx)) show(parseInt(nx, 10)); else finish(nx);
        });
      });
      restart.addEventListener('click', function () { show(0); });
    })();

    /* ---------- 10. Glossary search ---------- */
    (function () {
      var input = $('#glossarySearch');
      if (!input) return;
      var items = $$('#glossaryList .glossary-item');
      var empty = $('#glossaryEmpty');
      input.addEventListener('input', function () {
        var q = input.value.trim().toLowerCase();
        var shown = 0;
        items.forEach(function (it) {
          var hit = !q || it.textContent.toLowerCase().indexOf(q) !== -1;
          it.style.display = hit ? '' : 'none';
          if (hit) shown++;
        });
        if (empty) empty.style.display = shown ? 'none' : 'block';
      });
    })();

    /* ---------- 11. Checklist with localStorage ---------- */
    (function () {
      var list = $('#learnChecklist');
      if (!list) return;
      var boxes = $$('input[type=checkbox]', list);
      var fill = $('#clFill'), pct = $('#clPct');
      var KEY = 'ah-checklist';
      var state = {};
      try { state = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { state = {}; }
      function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
      function refresh() {
        var done = boxes.filter(function (b) { return b.checked; }).length;
        var p = boxes.length ? Math.round(done / boxes.length * 100) : 0;
        if (fill) fill.style.width = p + '%';
        if (pct) pct.textContent = p + '%';
      }
      boxes.forEach(function (b) {
        var k = b.getAttribute('data-ck');
        if (state[k]) b.checked = true;
        b.addEventListener('change', function () { state[k] = b.checked; save(); refresh(); });
      });
      refresh();
    })();

  })();
  </script>
</body>
</html>
